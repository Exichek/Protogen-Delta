[project]
name = "protogen-delta"
version = "0.1.0"
description = "Telegram bot powered by DeepSeek API"
authors = [
    { name = "Exi", email = "rey93sinkler@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.14,<3.15"

dependencies = [
    "aiogram (>=3.31.0,<4.0.0)",
    "openai (>=3.8.0,<4.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "aiohttp-socks (>=0.12.0,<0.13.0)",
]


[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
]


[tool.poetry]
packages = [
    { include = "protogen_delta", from = "src" }
]
include = [
    "src/protogen_delta/py.typed",
    "src/protogen_delta/config/data/*.json",
    "src/protogen_delta/config/prompts/*.txt",
    "src/protogen_delta/config/prompts/personality/*.txt",
]


[tool.black]
line-length = 88
target-version = ["py314"]


[tool.isort]
profile = "black"
line_length = 88


[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
