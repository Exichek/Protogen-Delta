<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ИИ-ассистент Протоген Дельта</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--tg-theme-text-color,#eef4ff); background: var(--tg-theme-bg-color,#0c1420); }
    main { width: min(100%, 720px); margin: 0 auto; padding: max(20px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom)); }
    header { display:flex; gap:14px; align-items:center; margin-bottom:20px; }
    .visor { width:56px; height:56px; border-radius:18px; display:grid; place-items:center; font-size:28px; background:linear-gradient(145deg,#25234c,#00b6d6); box-shadow:0 10px 28px #00b6d633; }
    h1 { margin:0; font-size:24px; } .muted { color:var(--tg-theme-hint-color,#95a4b8); margin:4px 0 0; }
    .card { background:var(--tg-theme-secondary-bg-color,#162333); border:1px solid #ffffff12; border-radius:18px; padding:16px; margin:12px 0; box-shadow:0 12px 30px #0003; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .stat { padding:12px; border-radius:14px; background:#ffffff08; } .stat b { display:block; margin-top:5px; }
    label { display:block; font-size:13px; color:var(--tg-theme-hint-color,#95a4b8); margin:14px 0 6px; }
    select,textarea,button { width:100%; border:0; border-radius:12px; font:inherit; }
    select,textarea { padding:12px; color:var(--tg-theme-text-color,#eef4ff); background:var(--tg-theme-bg-color,#0c1420); outline:1px solid #ffffff18; }
    textarea { min-height:110px; resize:vertical; }
    button { margin-top:16px; padding:13px; font-weight:700; color:var(--tg-theme-button-text-color,#fff); background:var(--tg-theme-button-color,#6c5ce7); cursor:pointer; }
    button.secondary { color:#ffb2b9; background:#ff556622; outline:1px solid #ff718044; }
    button:disabled { opacity:.55; cursor:wait; } #status { min-height:22px; margin:12px 2px; font-size:14px; }
    .appearance-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .appearance-actions button { margin-top:12px; }
    .appearance-preview { display:block; width:100%; max-height:260px; object-fit:contain; margin-top:14px; border-radius:12px; background:var(--tg-theme-bg-color,#0c1420); }
    .appearance-preview[hidden] { display:none; }
    #appearance { white-space:pre-wrap; overflow-wrap:anywhere; }
    #appearance-status { margin-top:12px; min-height:20px; font-size:14px; }
    #appearance-file-name { overflow-wrap:anywhere; font-size:13px; }
    .error { color:#ff7d88; } .ok { color:#62dca4; }
    @media (max-width:430px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<main>
  <header><div class="visor">Δ</div><div><h1>Протоген Дельта</h1><p class="muted">ИИ-ассистент с характером</p><p class="muted" id="hello">Профиль и настройки</p></div></header>
  <section class="card">
    <div class="grid">
      <div class="stat">Возрастной режим<b id="mode">—</b></div>
      <div class="stat">RP-сцена<b id="rp-state">—</b></div>
    </div>
    <label for="content-mode">Режим общения</label>
    <select id="content-mode"><option value="soft">Мягкий</option><option value="adult">18+</option></select>
    <label for="configuration">Конфигурация Дельты в RP</label>
    <select id="configuration"><option value="male">Мужская</option><option value="female">Женская</option></select>
    <label for="character">Мой персонаж для RP</label>
    <textarea id="character" maxlength="1000" placeholder="Вид, внешность, важные детали и роль в сцене"></textarea>
    <label for="preferences">Что мне нравится в RP</label>
    <textarea id="preferences" maxlength="1000" placeholder="Темы, динамика, тон и детали, которые хочется видеть чаще"></textarea>
    <label for="boundaries">Мои границы</label>
    <textarea id="boundaries" maxlength="1000" placeholder="Что нельзя добавлять в сцену"></textarea>
    <p class="muted" id="fetishes">Распознанные темы: пока нет</p>
    <button id="save">Сохранить настройки</button>
    <button class="secondary" id="clear-rp">Очистить RP-профиль</button>
    <div id="status"></div>
  </section>
  <section class="card" aria-labelledby="appearance-title">
    <b id="appearance-title">Текущий облик Дельты</b>
    <p class="muted" id="appearance">Базовый облик</p>
    <p class="muted">Загрузи арт персонажа — я разберу внешность и приму этот облик.</p>
    <p class="muted">JPEG, PNG или WebP до 20 МБ. Меняется только внешность.</p>
    <input id="appearance-file" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" hidden>
    <img id="appearance-preview" class="appearance-preview" alt="Выбранный арт для облика" hidden>
    <p id="appearance-file-name" class="muted"></p>
    <div class="appearance-actions">
      <button id="choose-appearance" type="button" disabled>Выбрать картинку</button>
      <button id="apply-appearance" type="button" disabled>Применить облик</button>
    </div>
    <button id="reset-appearance" class="secondary" type="button" disabled>Вернуть базовый облик</button>
    <div id="appearance-status" role="status" aria-live="polite"></div>
  </section>
</main>
<script>
  const tg = window.Telegram?.WebApp; if (tg) { tg.ready(); tg.expand(); }
  const initData = tg?.initData || ""; const status = document.querySelector("#status");
  const api = async (method="GET", body=null, path="/api/profile") => {
    const file = body instanceof File;
    const response = await fetch(path, {method, headers:{"X-Telegram-Init-Data":initData,"Content-Type":file ? (body.type || "application/octet-stream") : "application/json"}, body:file ? body : body?JSON.stringify(body):null});
    if (!response.ok) throw new Error(await response.text() || `HTTP ${response.status}`); return response.json();
  };
  const render = p => {
    document.querySelector("#hello").textContent = `${p.user.first_name} · ID ${p.user.id}`;
    document.querySelector("#content-mode").value = p.content_mode === "adult" ? "adult" : "soft";
    document.querySelector("#configuration").value = p.roleplay_configuration;
    document.querySelector("#character").value = p.roleplay_character;
    document.querySelector("#preferences").value = p.roleplay_preferences;
    document.querySelector("#boundaries").value = p.roleplay_boundaries;
    document.querySelector("#fetishes").textContent = `Распознанные темы: ${p.roleplay_fetishes.length ? p.roleplay_fetishes.join(", ") : "пока нет"}`;
    document.querySelector("#mode").textContent = p.content_mode === "adult" ? "18+" : "Мягкий";
    document.querySelector("#rp-state").textContent = p.roleplay_active ? "Активна" : "Выключена";
    renderAppearance(p);
  };
  const appearanceStatus = document.querySelector("#appearance-status");
  const fileInput = document.querySelector("#appearance-file");
  const preview = document.querySelector("#appearance-preview");
  let appearanceBusy = false, appearanceEnabled = false, customAppearance = false, selectedFile = null, previewUrl = null;
  const updateAppearanceButtons = () => {
    document.querySelector("#choose-appearance").disabled = appearanceBusy || !appearanceEnabled;
    document.querySelector("#apply-appearance").disabled = appearanceBusy || !appearanceEnabled || !selectedFile;
    document.querySelector("#reset-appearance").disabled = appearanceBusy || !customAppearance;
    fileInput.disabled = appearanceBusy || !appearanceEnabled;
  };
  const renderAppearance = p => {
    customAppearance = Boolean(p.delta_appearance);
    appearanceEnabled = Boolean(p.appearance_upload_enabled && initData);
    document.querySelector("#appearance").textContent = p.delta_appearance || "Базовый облик";
    updateAppearanceButtons();
  };
  const clearSelection = () => {
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = null; selectedFile = null; fileInput.value = "";
    preview.removeAttribute("src"); preview.hidden = true;
    document.querySelector("#appearance-file-name").textContent = "";
  };
  const appearanceFail = error => { appearanceStatus.className="error"; appearanceStatus.textContent = initData ? `Ошибка: ${error.message}` : "Открой панель кнопкой внутри Telegram."; };
  document.querySelector("#choose-appearance").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0]; if (!file) return;
    clearSelection(); appearanceStatus.textContent="";
    if (file.size > 20 * 1024 * 1024) { appearanceFail(new Error("Картинка должна быть до 20 МБ.")); updateAppearanceButtons(); return; }
    selectedFile = file; previewUrl = URL.createObjectURL(file); preview.src = previewUrl; preview.hidden = false;
    document.querySelector("#appearance-file-name").textContent = file.name;
    updateAppearanceButtons();
  });
  document.querySelector("#apply-appearance").addEventListener("click", async () => {
    if (!selectedFile || appearanceBusy) return;
    appearanceBusy = true; updateAppearanceButtons(); appearanceStatus.className=""; appearanceStatus.textContent="Разбираю внешность…";
    try {
      const profile = await api("POST", selectedFile, "/api/profile/appearance");
      renderAppearance(profile); clearSelection(); appearanceStatus.className="ok"; appearanceStatus.textContent="Облик сохранён. Теперь можно вернуться в чат.";
      tg?.HapticFeedback?.notificationOccurred("success");
    } catch(error) { appearanceFail(error); }
    finally { appearanceBusy=false; updateAppearanceButtons(); }
  });
  document.querySelector("#reset-appearance").addEventListener("click", async () => {
    if (appearanceBusy) return;
    appearanceBusy=true; updateAppearanceButtons(); appearanceStatus.className=""; appearanceStatus.textContent="Возвращаю базовый облик…";
    try {
      const profile = await api("DELETE", null, "/api/profile/appearance");
      renderAppearance(profile); clearSelection(); appearanceStatus.className="ok"; appearanceStatus.textContent="Базовый облик возвращён.";
      tg?.HapticFeedback?.notificationOccurred("success");
    } catch(error) { appearanceFail(error); }
    finally { appearanceBusy=false; updateAppearanceButtons(); }
  });
  const fail = e => { status.className="error"; status.textContent = initData ? `Ошибка: ${e.message}` : "Открой панель кнопкой внутри Telegram."; };
  api().then(render).catch(fail);
  document.querySelector("#save").addEventListener("click", async e => { const button=e.currentTarget; button.disabled=true; status.textContent="Сохраняю…"; status.className=""; try { const p=await api("PATCH",{content_mode:document.querySelector("#content-mode").value,roleplay_configuration:document.querySelector("#configuration").value,roleplay_character:document.querySelector("#character").value,roleplay_preferences:document.querySelector("#preferences").value,roleplay_boundaries:document.querySelector("#boundaries").value}); render(p); status.className="ok"; status.textContent="Сохранено."; tg?.HapticFeedback?.notificationOccurred("success"); } catch(err) { fail(err); } finally { button.disabled=false; } });
  document.querySelector("#clear-rp").addEventListener("click", async e => { if (!window.confirm("Удалить персонажа, предпочтения, границы и распознанные RP-темы?")) return; const button=e.currentTarget; button.disabled=true; try { const p=await api("DELETE",null,"/api/profile/roleplay"); render(p); status.className="ok"; status.textContent="RP-профиль очищен. Остальная память сохранена."; } catch(err) { fail(err); } finally { button.disabled=false; } });
</script>
</body>
</html>
